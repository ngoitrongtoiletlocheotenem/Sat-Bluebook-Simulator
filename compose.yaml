services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: pathwise
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pathwise -d pathwise]
      interval: 10s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      args:
        VITE_DESMOS_API_KEY: ${VITE_DESMOS_API_KEY:-}
        VITE_DESMOS_API_VERSION: ${VITE_DESMOS_API_VERSION:-1.12}
    environment:
      DATABASE_URL: postgresql://pathwise:${POSTGRES_PASSWORD}@db:5432/pathwise
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin}
      TRUST_PROXY: 1
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    ports:
      - 127.0.0.1:3001:3001
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  uploads:
